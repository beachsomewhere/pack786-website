<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070F1E" />
      <stop offset="55%" stop-color="#12283C" />
      <stop offset="100%" stop-color="#1C3D5A" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCEFC7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FCEFC7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)" />
  <ellipse cx="800" cy="700" rx="900" ry="220" fill="url(#horizonGlow)" />

  <!-- moon -->
  <circle cx="1310" cy="120" r="90" fill="url(#moonGlow)" />
  <circle cx="1310" cy="120" r="42" fill="#FCEFC7" opacity="0.9" />

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="70" r="1.6" opacity="0.8" />
    <circle cx="130" cy="140" r="1.2" opacity="0.6" />
    <circle cx="200" cy="60" r="1.8" opacity="0.9" />
    <circle cx="260" cy="180" r="1.3" opacity="0.5" />
    <circle cx="320" cy="90" r="1.5" opacity="0.7" />
    <circle cx="380" cy="220" r="1.1" opacity="0.5" />
    <circle cx="430" cy="50" r="1.7" opacity="0.8" />
    <circle cx="500" cy="150" r="1.3" opacity="0.6" />
    <circle cx="560" cy="80" r="1.9" opacity="0.9" />
    <circle cx="610" cy="200" r="1.2" opacity="0.5" />
    <circle cx="670" cy="40" r="1.6" opacity="0.8" />
    <circle cx="720" cy="120" r="1.2" opacity="0.6" />
    <circle cx="780" cy="60" r="1.8" opacity="0.9" />
    <circle cx="840" cy="190" r="1.1" opacity="0.5" />
    <circle cx="900" cy="90" r="1.5" opacity="0.7" />
    <circle cx="950" cy="30" r="1.3" opacity="0.6" />
    <circle cx="1000" cy="160" r="1.7" opacity="0.8" />
    <circle cx="1060" cy="70" r="1.2" opacity="0.5" />
    <circle cx="1120" cy="200" r="1.6" opacity="0.8" />
    <circle cx="1180" cy="50" r="1.3" opacity="0.6" />
    <circle cx="1230" cy="230" r="1.4" opacity="0.6" />
    <circle cx="1420" cy="80" r="1.5" opacity="0.7" />
    <circle cx="1480" cy="180" r="1.2" opacity="0.5" />
    <circle cx="1540" cy="60" r="1.8" opacity="0.9" />
    <circle cx="90" cy="250" r="1.1" opacity="0.4" />
    <circle cx="240" cy="270" r="1.3" opacity="0.5" />
    <circle cx="410" cy="290" r="1.1" opacity="0.4" />
    <circle cx="600" cy="260" r="1.2" opacity="0.5" />
    <circle cx="850" cy="270" r="1.3" opacity="0.5" />
    <circle cx="1080" cy="280" r="1.1" opacity="0.4" />
    <circle cx="1350" cy="260" r="1.2" opacity="0.5" />
  </g>

  <!-- warm window/campfire glow peeking through the trees -->
  <g fill="#F2C265">
    <circle cx="300" cy="660" r="3.2" opacity="0.85" />
    <circle cx="740" cy="668" r="2.6" opacity="0.7" />
    <circle cx="1180" cy="662" r="3" opacity="0.8" />
  </g>

  <!-- back treeline (shorter, muted, for depth) -->
  <path
    fill="#12283C"
    d="M0,700
       l16,-90 l16,90 l16,-130 l16,130 l16,-75 l16,75 l16,-150 l16,150 l16,-100 l16,100 l16,-70 l16,70 l16,-120 l16,120 l16,-85 l16,85 l16,-140 l16,140 l16,-95 l16,95 l16,-75 l16,75 l16,-115 l16,115
       l16,-90 l16,90 l16,-130 l16,130 l16,-75 l16,75 l16,-150 l16,150 l16,-100 l16,100 l16,-70 l16,70 l16,-120 l16,120 l16,-85 l16,85 l16,-140 l16,140 l16,-95 l16,95 l16,-75 l16,75 l16,-115 l16,115
       l16,-90 l16,90
       Z"
  />

  <!-- front treeline (taller, dark, main silhouette) -->
  <path
    fill="#08131F"
    d="M0,700
       l16,-180 l16,180 l16,-260 l16,260 l16,-150 l16,150 l16,-300 l16,300 l16,-200 l16,200 l16,-140 l16,140 l16,-240 l16,240 l16,-170 l16,170 l16,-280 l16,280 l16,-190 l16,190 l16,-150 l16,150 l16,-230 l16,230
       l16,-180 l16,180 l16,-260 l16,260 l16,-150 l16,150 l16,-300 l16,300 l16,-200 l16,200 l16,-140 l16,140 l16,-240 l16,240 l16,-170 l16,170 l16,-280 l16,280 l16,-190 l16,190 l16,-150 l16,150 l16,-230 l16,230
       l16,-180 l16,180
       Z"
  />
</svg>
